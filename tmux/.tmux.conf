set -sg terminal-overrides ",*:RGB"
set -g terminal-features '*:RGB'

set -g xterm-keys on

# allow repeat while held with -r
bind -r -T prefix M-b resize-pane -L 5
bind -r -T prefix M-f resize-pane -R 5
bind -r -T prefix M-p resize-pane -U 5
bind -r -T prefix M-n resize-pane -D 5

# Status bar — TokyoNight Storm
set -g status-style "bg=#1f2335,fg=#c0caf5"
set -g status-left "#[bg=#7aa2f7,fg=#1f2335,bold] #S #[bg=#1f2335] "
set -g status-left-length 30
set -g status-right "#[fg=#565f89]%H:%M  %d %b #[bg=#3b4261,fg=#c0caf5] #h "
set -g status-right-length 50
set -g window-status-format "#[fg=#565f89] #I:#W "
set -g window-status-current-format "#[bg=#3b4261,fg=#bb9af7,bold] #I:#W "
set -g window-status-separator ""
set -g status-position bottom

# Clean session picker
bind e choose-tree

# Even simpler session list
bind S run-shell "tmux list-sessions -F '#S' | tmux choose-window -p"
